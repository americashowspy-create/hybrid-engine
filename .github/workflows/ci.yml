name: Hybrid Engine CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test (stdlib)
        run: python -m unittest discover -s tests -v
      - name: CLI smoke test
        run: |
          python -m hybrid_engine --help
          python -m hybrid_engine inspect --target .
