name: Hybrid Engine CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One CI execution per current PR head; stale runs are cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Test (stdlib)
        run: python -m unittest discover -s tests -v
      - name: CLI smoke test
        run: |
          python -m hybrid_engine --help
          python -m hybrid_engine inspect --target .
          python -m hybrid_engine db-audit --help
          python -m hybrid_engine assess --help
          python -m hybrid_engine advise --help
          python -m hybrid_engine project-audit --help
          python -m hybrid_engine project-audit --no-auto-scope --help
          python -m hybrid_engine project-audit --target . --output "$RUNNER_TEMP/hybrid-project-audit.json" > /dev/null
          python -c "import json, os; d=json.load(open(os.path.join(os.environ['RUNNER_TEMP'], 'hybrid-project-audit.json'))); assert d['mode']=='static_read_only' and d['tests']['status']=='NOT_RUN' and d['changes']['target_files_modified']==0"
          python -m hybrid_engine evidence-import --help
          python -m hybrid_engine assess --target . --output "$RUNNER_TEMP/hybrid-assessment.json" > /dev/null
          python -m hybrid_engine advise --report "$RUNNER_TEMP/hybrid-assessment.json" > /dev/null
          python -m hybrid_engine evidence-import --report tests/fixtures/evidence/native-v1.json --report tests/fixtures/evidence/sarif-2.1.0.json --output "$RUNNER_TEMP/hybrid-evidence.json" > /dev/null
          python -m hybrid_engine advise --report "$RUNNER_TEMP/hybrid-evidence.json" --output "$RUNNER_TEMP/hybrid-advice.json" > /dev/null
          python -c "import json, os; p=os.path.join(os.environ['RUNNER_TEMP'], 'hybrid-advice.json'); d=json.load(open(p)); assert d['status']=='BLOCKED' and d['ready_for_proposal'] is False"
          python -m hybrid_engine gh-audit --help
          python -m hybrid_engine gh-propose --help
          python -m hybrid_engine gh-task --help
          python -m hybrid_engine gh-verify --help
          python -m hybrid_engine gh-auto --help
          python -m hybrid_engine gh-workorder --help
          python -m hybrid_engine gh-execute --help
          python -m hybrid_engine gh-agent --help
          python -m hybrid_engine gh-chat-package --help
          python -m hybrid_engine gh-advice-package --help

      - name: Remote GitHub audit of this repository (main branch only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPOSITORY: ${{ github.repository }}
        run: |
          python -m hybrid_engine gh-audit --repo "$TARGET_REPOSITORY" --ref main --output /tmp/hybrid-self-audit.json > /dev/null
          python -c "import json; d=json.load(open('/tmp/hybrid-self-audit.json')); assert d['mode']=='remote-read-only' and d['files_scanned'] > 0 and d['tests']['status']=='NOT_RUN'"
