[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-engine-framework"
version = "0.6.0"
description = "Chat-first, agent-agnostic workflow orchestration and auditing"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "americashowspy-create" }]
dependencies = []

[project.scripts]
hybrid = "hybrid_engine.cli:main"

[tool.setuptools.packages.find]
include = ["hybrid_engine*"]
